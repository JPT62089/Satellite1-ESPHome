globals:
  - id: volume_buttons_touched
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: factory_reset_requested
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: factory_reset_warning_active
    type: bool
    restore_value: no
    initial_value: 'false'

event:
  - platform: template
    id: action_button_press_event
    name: "Action Button Press"
    icon: mdi:button-pointer
    device_class: button
    event_types:
      - single_press
      - double_press
      - triple_press
      - long_press

satellite1_buttons:
  id: button_manager
  debounce: 20ms
  multi_click_window: 300ms
  buttons:
    - id: btn_up
      port: INPUT_A
      pin: 0
      name: "Volume Up"
      icon: "mdi:volume-plus"
      on_press:
        - lambda: id(volume_buttons_touched) = true;
        - script.execute:
            id: control_volume
            increase_volume: true

    - id: btn_down
      port: INPUT_A
      pin: 2
      name: "Volume Down"
      icon: "mdi:volume-minus"
      on_press:
        - lambda: id(volume_buttons_touched) = true;
        - script.execute:
            id: control_volume
            increase_volume: false

    - id: btn_left
      port: INPUT_A
      pin: 3
      name: "Hardware Mute"
      icon: "mdi:microphone-off"
      on_single_click:
        - if:
            condition:
              switch.is_on: master_mute_switch
            then:
              - script.execute:
                  id: play_sound
                  priority: false
                  sound_file: !lambda return id(mute_switch_off_sound);
              - switch.template.publish:
                  id: master_mute_switch
                  state: OFF
            else:
              - script.execute:
                  id: play_sound
                  priority: false
                  sound_file: !lambda return id(mute_switch_on_sound);
              - switch.template.publish:
                  id: master_mute_switch
                  state: ON

    - id: btn_action
      name: "Action"
      icon: "mdi:gesture-tap"
      gpio:
        number: 0
        inverted: true
        mode:
          input: true
          pullup: true
        ignore_strapping_warning: true
      on_press:
        - script.execute: control_leds
      on_release:
        - script.execute: control_leds
        - if:
            condition:
              lambda: return id(factory_reset_warning_active);
            then:
              - lambda: id(factory_reset_warning_active) = false;
              - light.turn_off: voice_assistant_leds
              - script.execute:
                  id: play_sound
                  priority: true
                  sound_file: !lambda return id(factory_reset_cancelled_sound);
      on_single_click:
        - if:
            condition:
              lambda: return !id(init_in_progress);
            then:
              - event.trigger:
                  id: action_button_press_event
                  event_type: "single_press"
              - script.execute: handle_single_press
      on_double_click:
        - if:
            condition:
              lambda: return !id(init_in_progress);
            then:
              - script.execute:
                  id: play_sound
                  priority: false
                  sound_file: !lambda return id(center_button_double_press_sound);
              - event.trigger:
                  id: action_button_press_event
                  event_type: "double_press"
      on_triple_click:
        - if:
            condition:
              lambda: return !id(init_in_progress);
            then:
              - script.execute:
                  id: play_sound
                  priority: false
                  sound_file: !lambda return id(center_button_triple_press_sound);
              - event.trigger:
                  id: action_button_press_event
                  event_type: "triple_press"
      on_hold:
        - duration: 1s
          then:
            - if:
                condition:
                  lambda: return !id(init_in_progress);
                then:
                  - script.execute:
                      id: play_sound
                      priority: false
                      sound_file: !lambda return id(center_button_long_press_sound);
                  - light.turn_off: voice_assistant_leds
                  - event.trigger:
                      id: action_button_press_event
                      event_type: "long_press"
        - duration: 10s
          then:
            - lambda: id(factory_reset_warning_active) = true;
            - light.turn_on:
                brightness: 100%
                id: voice_assistant_leds
                effect: "Factory Reset Coming Up"
            - script.execute:
                id: play_sound
                priority: true
                sound_file: !lambda return id(factory_reset_initiated_sound);
        - duration: 22s
          then:
            - lambda: id(factory_reset_warning_active) = false;
            - if:
                condition:
                  lambda: return id(xflash).flash_accessible();
                then:
                  - lambda: id(factory_reset_requested) = true;
                  - memory_flasher.erase:
                else:
                  - button.press: factory_reset_button

script:
  - id: handle_single_press
    then:
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing
            - script.stop: handle_single_press
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:
            - script.stop: handle_single_press
      - if:
          condition:
            media_player.is_announcing:
          then:
            - media_player.stop:
                announcement: true
            - script.stop: handle_single_press
      - if:
          condition:
            media_player.is_playing:
          then:
            - media_player.pause:
            - script.stop: handle_single_press
      - if:
          condition:
            and:
              - switch.is_off: master_mute_switch
              - not:
                  voice_assistant.is_running
          then:
            - script.execute:
                id: play_sound
                priority: true
                sound_file: !lambda return id(center_button_press_sound);
            - delay: 300ms
            - voice_assistant.start:
