speaker:
  - platform: audio_visualizer
    id: audio_viz
    output_speaker: media_mixing_input
    bits_per_sample: 16
    num_channels: 2
    sample_rate: 48000

switch:
  - platform: template
    name: "Visualizer Reverse"
    id: viz_reverse
    icon: "mdi:swap-horizontal"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(visualizer_preset).current_option() != "Off";'
          then:
            - script.execute: control_leds
    on_turn_off:
      - if:
          condition:
            lambda: 'return id(visualizer_preset).current_option() != "Off";'
          then:
            - script.execute: control_leds

  - platform: template
    name: "Visualizer Mirror"
    id: viz_mirror
    icon: "mdi:mirror"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(visualizer_preset).current_option() != "Off";'
          then:
            - script.execute: control_leds
    on_turn_off:
      - if:
          condition:
            lambda: 'return id(visualizer_preset).current_option() != "Off";'
          then:
            - script.execute: control_leds

select:
  - platform: template
    name: "Visualizer Preset"
    id: visualizer_preset
    icon: "mdi:palette"
    entity_category: config
    options:
      - "Off"
      - "Spectrum"
      - "Pulse"
      - "VU Sweep"
      - "Waveform"
    initial_option: "Off"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: control_leds

number:
  - platform: template
    name: "Visualizer Speed"
    id: viz_speed
    icon: "mdi:speedometer"
    entity_category: config
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 5
    restore_value: true
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: 'return id(visualizer_preset).current_option() != "Off";'
          then:
            - script.execute: control_leds

  - platform: template
    name: "Visualizer Intensity"
    id: viz_intensity
    icon: "mdi:brightness-6"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 200
    step: 5
    initial_value: 100
    restore_value: true
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: 'return id(visualizer_preset).current_option() != "Off";'
          then:
            - script.execute: control_leds

  - platform: template
    name: "Visualizer Start"
    id: viz_start
    icon: "mdi:map-marker-circle"
    entity_category: config
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: 'return id(visualizer_preset).current_option() != "Off";'
          then:
            - script.execute: control_leds
