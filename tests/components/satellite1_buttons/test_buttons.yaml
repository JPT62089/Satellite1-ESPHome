substitutions:
  friendly_name: "Satellite1 Buttons Testing"
  node_name: sat1-buttons-testing

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  min_version: 2024.9.0

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

spi:
  - id: spi_0
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13

external_components:
  - source:
      type: local
      path: ../../../esphome/components
    components: [satellite1, satellite1_buttons]

satellite1:
  id: satellite1_id
  spi_id: spi_0
  cs_pin: GPIO10
  data_rate: 8000000
  spi_mode: MODE3
  xmos_rst_pin: GPIO4

satellite1_buttons:
  id: btn_manager
  debounce: 25ms
  multi_click_window: 300ms
  buttons:
    # XMOS SPI button on port A, pin 0
    - id: btn_vol_up
      name: "Volume Up"
      icon: "mdi:volume-plus"
      port: INPUT_A
      pin: 0
      repeat_interval: 200ms
      on_press:
        then:
          - logger.log: "Vol+ pressed"
      on_release:
        then:
          - logger.log: "Vol+ released"
      on_hold_repeat:
        then:
          - logger.log: "Vol+ repeat"

    # XMOS SPI button on port A, pin 2
    - id: btn_vol_down
      name: "Volume Down"
      icon: "mdi:volume-minus"
      port: INPUT_A
      pin: 2
      repeat_interval: 200ms
      on_press:
        then:
          - logger.log: "Vol- pressed"

    # XMOS SPI button on port A, pin 3
    - id: btn_mute
      name: "Mute"
      icon: "mdi:microphone-off"
      port: INPUT_A
      pin: 3
      on_single_click:
        then:
          - logger.log: "Mute single click"
      on_double_click:
        then:
          - logger.log: "Mute double click"

    # Native ESP32 GPIO button
    - id: btn_action
      name: "Action"
      icon: "mdi:gesture-tap"
      gpio:
        number: 0
        inverted: true
        mode:
          input: true
          pullup: true
        ignore_strapping_warning: true
      debounce: 30ms
      on_press:
        then:
          - logger.log: "Action pressed"
      on_release:
        then:
          - logger.log: "Action released"
      on_single_click:
        then:
          - logger.log: "Action single click"
      on_double_click:
        then:
          - logger.log: "Action double click"
      on_triple_click:
        then:
          - logger.log: "Action triple click"
      on_hold:
        - duration: 1s
          then:
            - logger.log: "Action held 1s"
        - duration: 10s
          then:
            - logger.log: "Action held 10s"

  combos:
    - buttons:
        - btn_vol_up
        - btn_vol_down
      hold_duration: 3s
      on_combo:
        then:
          - logger.log: "Vol+/Vol- combo held 3s"
